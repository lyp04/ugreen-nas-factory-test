name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "New tag to publish (e.g. v0.2.0), bound to the selected ref. Existing tags/releases are refused."
        required: true

permissions:
  contents: write

concurrency:
  # Serialize every attempt for the same release tag. A queued duplicate reaches
  # the immutable-release preflight only after the first attempt has published.
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:DISPATCH_TAG
          } else {
            $tag = $env:PUSH_TAG
          }
          if (-not $tag.StartsWith("v")) {
            throw "Tag must start with 'v' (got '$tag')"
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw "Release tag must be semantic version form vMAJOR.MINOR.PATCH (got '$tag')"
          }
          $name = $tag.Substring(1)
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable release source
        id: source
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid release tag: '$tag'"
          }

          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $headCommit) {
            throw "Could not resolve the checked-out release commit"
          }

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            # Manual releases are create-only. Reusing a tag could otherwise build
            # the selected workflow ref and silently replace an unrelated tag's assets.
            $null = git ls-remote --exit-code --tags origin "refs/tags/$tag"
            $tagLookupExit = $LASTEXITCODE
            if ($tagLookupExit -eq 0) {
              throw "workflow_dispatch refuses to reuse existing tag '$tag'"
            }
            if ($tagLookupExit -ne 2) {
              throw "Could not verify whether tag '$tag' already exists (git exit $tagLookupExit)"
            }
          } else {
            # A tag-push build must run from the commit the pushed tag actually names.
            $tagCommit = (git rev-list -n 1 "refs/tags/$tag").Trim()
            if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
              throw "Pushed tag '$tag' is not available after checkout"
            }
            if ($tagCommit -ne $headCommit) {
              throw "Checked-out commit $headCommit does not match tag '$tag' commit $tagCommit"
            }
          }

          $escapedTag = [Uri]::EscapeDataString($tag)
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$escapedTag"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseExists = $false
          try {
            $null = Invoke-RestMethod -Uri $releaseUrl -Headers $headers -Method Get
            $releaseExists = $true
          } catch {
            $response = $_.Exception.Response
            $statusCode = if ($null -ne $response) { [int]$response.StatusCode } else { 0 }
            if ($statusCode -ne 404) {
              throw "Could not verify release immutability for '$tag': $($_.Exception.Message)"
            }
          }
          if ($releaseExists) {
            throw "Release '$tag' already exists; refusing to overwrite its metadata or assets"
          }

          "target_sha=$headCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compute version code
        id: code
        shell: pwsh
        run: |
          $code = (git rev-list --count HEAD).Trim()
          "code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version_code = $code"

      - name: Stamp src/version.py
        shell: pwsh
        env:
          VERSION_NAME: ${{ steps.tag.outputs.name }}
          VERSION_CODE: ${{ steps.code.outputs.code }}
        run: |
          $content = @"
          from __future__ import annotations

          PACKAGE_NAME = "ugreen-nas-factory-test"
          VERSION_NAME = "$env:VERSION_NAME"
          VERSION_CODE = $env:VERSION_CODE

          __all__ = ["PACKAGE_NAME", "VERSION_NAME", "VERSION_CODE"]
          "@
          Set-Content -Path src/version.py -Value $content -Encoding utf8
          Get-Content src/version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pytest tests -q

      - name: Build exe
        shell: pwsh
        run: |
          # build-exe.ps1 expects .venv\Scripts\python.exe. Skip its env check and
          # invoke PyInstaller directly with the Python that setup-python provided.
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (-not (Test-Path dist)) { New-Item -ItemType Directory -Force dist | Out-Null }
          python -m pip install pyinstaller
          python -m PyInstaller `
            --name "UGREEN-NAS-Test" `
            --onefile `
            --windowed `
            --collect-all playwright `
            --collect-all zeroconf `
            --collect-all barcode `
            --hidden-import "PIL" `
            --hidden-import "PIL.Image" `
            --hidden-import "PIL.ImageDraw" `
            --hidden-import "PIL.ImageFont" `
            --hidden-import "PIL.ImageChops" `
            --hidden-import "win32print" `
            --hidden-import "src.cli" `
            --hidden-import "src.report" `
            --hidden-import "src.report.reporter" `
            --hidden-import "src.report.github_issues" `
            --hidden-import "src.report.collector" `
            --hidden-import "src.report.fingerprint" `
            --hidden-import "src.report.redact" `
            --hidden-import "src.gui" `
            --hidden-import "src.updater" `
            --hidden-import "src.version" `
            --hidden-import "src.form_entry" `
            --hidden-import "src.flows.setup_wizard" `
            --hidden-import "src.flows.login" `
            --hidden-import "src.flows.capture" `
            --hidden-import "src.flows.provision" `
            --hidden-import "src.flows.cleanup" `
            --hidden-import "src.flows.reset_factory" `
            --hidden-import "src.discovery.discover" `
            --hidden-import "src.discovery.mdns_scanner" `
            --hidden-import "src.discovery.port_scanner" `
            --hidden-import "src.discovery.ugreen_broadcast" `
            --hidden-import "src.utils.label" `
            .\src\gui.py
          if (-not (Test-Path dist\UGREEN-NAS-Test.exe)) {
            throw "PyInstaller did not produce dist\UGREEN-NAS-Test.exe"
          }

      - name: Stage dist/config for downstream packaging
        shell: pwsh
        run: |
          if (Test-Path dist\config) { Remove-Item -Recurse -Force dist\config }
          New-Item -ItemType Directory -Force dist\config | Out-Null
          # Release config is create-from-empty and exact-allowlist only. Never
          # copy the source config directory: it may contain gitignored config.yml,
          # label data, credentials, logs, or nested runtime files on a build host.
          $publicConfigSources = [ordered]@{
            "config.example.yml" = "config\config.example.yml"
            "selectors.yml"      = "config\selectors.yml"
          }
          foreach ($entry in $publicConfigSources.GetEnumerator()) {
            if (-not (Test-Path -LiteralPath $entry.Value -PathType Leaf)) {
              throw "Missing public config source: $($entry.Value)"
            }
            $sourceItem = Get-Item -LiteralPath $entry.Value
            if (($sourceItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Public config source must not be a symlink or junction: $($entry.Value)"
            }
            Copy-Item -Force -LiteralPath $entry.Value -Destination (Join-Path "dist\config" $entry.Key)
          }
          # Public repo: release assets download without auth, so the client needs
          # no token. Ship an empty token — never embed a PAT in a build here.
          $cfg = [ordered]@{
            enabled       = $true
            owner         = "${{ github.repository_owner }}"
            repo          = "$(($env:GITHUB_REPOSITORY -split '/')[1])"
            token         = ""
            manifestAsset = "update.json"
            releaseTag    = ""
          }
          ($cfg | ConvertTo-Json -Depth 4) | Set-Content -Path dist\config\update-config.json -Encoding utf8

          $configRoot = (Resolve-Path -LiteralPath "dist\config").Path.TrimEnd('\', '/')
          $allowedConfigFiles = @("config.example.yml", "selectors.yml", "update-config.json")
          foreach ($item in Get-ChildItem -LiteralPath $configRoot -Recurse -Force) {
            $relative = $item.FullName.Substring($configRoot.Length).TrimStart([char[]]"\/").Replace('\', '/')
            if ($item.PSIsContainer) {
              throw "Release config contains a non-allowlisted directory: $relative"
            }
            if ($allowedConfigFiles -notcontains $relative) {
              throw "Release config contains a non-allowlisted file: $relative"
            }
            if ($item.Name -ieq "config.yml" -or $item.Name -match '(?i)^\.env(?:\..+)?$') {
              throw "Release config contains a private config or environment file: $relative"
            }
            $text = [System.IO.File]::ReadAllText($item.FullName)
            if ($text -match '-----BEGIN (?:[A-Z0-9]+ )?PRIVATE KEY-----') {
              throw "Release config contains private-key material: $relative"
            }
          }
          $stagedConfigFiles = @(Get-ChildItem -LiteralPath $configRoot -Recurse -File -Force)
          if ($stagedConfigFiles.Count -ne $allowedConfigFiles.Count) {
            throw "Release config must contain exactly the three public files"
          }

      - name: Build update.json manifest
        id: manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          VERSION_NAME: ${{ steps.tag.outputs.name }}
          VERSION_CODE: ${{ steps.code.outputs.code }}
        run: |
          $exe = "dist\UGREEN-NAS-Test.exe"
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $notes = ""
          try {
            # Annotated tag body if any; falls back to commit subject. Force the
            # git output to a single string so ConvertTo-Json doesn't emit an array.
            $rawTag = git tag -l --format='%(contents)' $env:RELEASE_TAG | Out-String
            $notes = $rawTag.Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) {
              $rawCommit = git log -1 --pretty=%B | Out-String
              $notes = $rawCommit.Trim()
            }
          } catch {}
          $manifest = [ordered]@{
            packageName = "ugreen-nas-factory-test"
            versionCode = [int]$env:VERSION_CODE
            versionName = $env:VERSION_NAME
            exeAsset    = "UGREEN-NAS-Test.exe"
            sha256      = $sha
            notes       = $notes
          }
          ($manifest | ConvertTo-Json -Depth 4) | Set-Content -Path dist\update.json -Encoding utf8
          Get-Content dist\update.json

      - name: Package and verify public zip
        shell: pwsh
        env:
          VERSION_NAME: ${{ steps.tag.outputs.name }}
        run: |
          $zipName = "UGREEN-NAS-Test-$($env:VERSION_NAME).zip"
          Compress-Archive -Path dist\UGREEN-NAS-Test.exe, dist\config -DestinationPath "dist\$zipName" -Force
          $checkDir = Join-Path $env:RUNNER_TEMP "ugreen-release-check"
          if (Test-Path $checkDir) { Remove-Item -Recurse -Force $checkDir }
          Expand-Archive -Path "dist\$zipName" -DestinationPath $checkDir
          $allowedFiles = @(
            "UGREEN-NAS-Test.exe",
            "config\config.example.yml",
            "config\selectors.yml",
            "config\update-config.json"
          )
          $forbiddenSegments = @(
            ".git", ".venv", "venv", "state", "log", "logs", "tmp", "temp",
            "build", "dist", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache"
          )
          $forbiddenExtensions = @(
            ".key", ".pem", ".pfx", ".p12", ".ppk", ".kdbx", ".log", ".tmp",
            ".bak", ".backup", ".old", ".orig", ".save", ".swp", ".swo"
          )
          $privateKeyNames = @("id_rsa", "id_dsa", "id_ecdsa", "id_ed25519", "authorized_keys")
          $checkRoot = (Resolve-Path -LiteralPath $checkDir).Path.TrimEnd('\', '/')
          foreach ($item in Get-ChildItem -LiteralPath $checkRoot -Recurse -Force) {
            $relative = $item.FullName.Substring($checkRoot.Length).TrimStart([char[]]"\/")
            $normalized = $relative.Replace('\', '/')
            foreach ($segment in @($normalized -split '/')) {
              if ($forbiddenSegments -contains $segment -or $segment.StartsWith(".") -or
                  $segment -match '(?i)\.local\.' -or
                  $segment -match '(?i)(?:^|\.)(?:bak|backup|old|orig|save|swp|swo)(?:\.|$)' -or
                  $segment -match '~$' -or $segment -match '^#.*#$') {
                throw "Release zip contains a forbidden path: $normalized"
              }
            }
            if ($item.PSIsContainer) {
              if ($normalized -ne "config") {
                throw "Release zip contains a non-allowlisted directory: $normalized"
              }
              continue
            }
            if ($allowedFiles -notcontains $relative) {
              throw "Release zip contains a non-allowlisted file: $normalized"
            }
            if ($item.Name -ieq "config.yml" -or $item.Name -match '(?i)^\.env(?:\..+)?$') {
              throw "Release zip contains a private config or environment file: $normalized"
            }
            if ($privateKeyNames -contains $item.Name -or $forbiddenExtensions -contains $item.Extension) {
              throw "Release zip contains a key, log, or temporary file: $normalized"
            }
            if ($item.Extension -in @(".json", ".yml", ".yaml", ".txt")) {
              $text = [System.IO.File]::ReadAllText($item.FullName)
              if ($text -match '-----BEGIN (?:[A-Z0-9]+ )?PRIVATE KEY-----') {
                throw "Release zip contains private-key material: $normalized"
              }
            }
          }
          foreach ($relative in $allowedFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $checkRoot $relative) -PathType Leaf)) {
              throw "Release zip is missing $relative"
            }
          }

      - name: Upload build artifacts (for inspection on failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.tag.outputs.tag }}
          path: |
            dist/UGREEN-NAS-Test.exe
            dist/update.json
            dist/UGREEN-NAS-Test-*.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Create immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        run: |
          # `gh release create` is create-only: if a release appeared after the
          # preflight (for example via a manual race), it fails instead of updating
          # that release or replacing any asset. --target binds a new dispatch tag
          # to the exact commit that this job built.
          $zipAssets = @(Get-ChildItem -Path "dist\UGREEN-NAS-Test-*.zip" -File)
          if ($zipAssets.Count -ne 1) {
            throw "Expected exactly one release zip, found $($zipAssets.Count)"
          }
          $releaseArgs = @(
            "release", "create", $env:RELEASE_TAG,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:TARGET_SHA,
            "--title", $env:RELEASE_TAG,
            "--generate-notes",
            "dist\UGREEN-NAS-Test.exe",
            "dist\update.json",
            $zipAssets[0].FullName
          )
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed; no existing release or asset was overwritten"
          }
